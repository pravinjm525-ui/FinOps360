trigger:
  branches:
    include:
      - release/*

parameters:
  - name: targetEnvironment
    displayName: Target Environment
    type: string
    default: DEV
    values:
      - DEV
      - UAT
      - PROD

variables:
  - template: variables/common.yml

  - ${{ if eq(parameters.targetEnvironment,'DEV') }}:
      - template: variables/dev.yml

  - ${{ if eq(parameters.targetEnvironment,'UAT') }}:
      - template: variables/uat.yml

  - ${{ if eq(parameters.targetEnvironment,'PROD') }}:
      - template: variables/prod.yml

# Azure DevOps Variable Groups
# (Enable after Azure DevOps setup)

# - group: FinOps360-DEV
# - group: FinOps360-UAT
# - group: FinOps360-PROD

stages:
  - template: stages/deploy.yml
    parameters:
      environmentName: ${{ parameters.targetEnvironment }}

      variableFile: variables/${{ lower(parameters.targetEnvironment) }}.yml

  - template: stages/cleanup.yml
