services:

  postgres:
    image: postgres:16
    container_name: finops360-postgres

    env_file:
      - ../config/common.env
      - ../config/dev/database.env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U admin -d finopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:

    image: ${BACKEND_IMAGE}

    container_name: finops360-backend

    env_file:
      - ../config/common.env
      - ../config/dev/app.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:8081"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

  frontend:

    image: ${FRONTEND_IMAGE}

    container_name: finops360-frontend

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT}:5173"

volumes:

  postgres-data:
