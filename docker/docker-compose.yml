services:

  postgres:
    image: postgres:16
    container_name: finops360-postgres

    environment:
      POSTGRES_DB: finopsdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U admin -d finopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: finops360-backend:v5
    container_name: finops360-backend

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8081"

volumes:
  postgres-data:
